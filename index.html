<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101013" />
    <meta
      name="description"
      content="Create cinematic profile cards with custom photos, holographic finishes, and high-resolution exports. Private, free, and entirely in your browser."
    />
    <title>Profile Card Maker — Card Studio</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="model.js" defer></script>
    <script src="renderer.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Profile Card Maker home"
        ><span class="mark">P</span
        ><span>Profile Card Maker<small>CARD STUDIO</small></span></a
      >
      <div class="top-actions">
        <span id="draftStatus" class="draft-status" role="status"
          >Draft ready</span
        ><button id="importProject" class="quiet">Open project</button
        ><button id="saveProject" class="quiet">Save project</button>
      </div>
    </header>
    <main class="workspace">
      <aside class="editor" aria-label="Card editor">
        <div class="editor-heading">
          <h1>Make it yours.</h1>
          <span class="edition">STUDIO / 02</span>
        </div>
        <details open>
          <summary><span class="section-number">01</span> Identity</summary>
          <div class="section-body">
            <label class="upload" id="dropzone" for="photo"
              ><span class="upload-icon" aria-hidden="true">+</span
              ><strong id="uploadLabel">Drop a photo or browse</strong
              ><span>JPG, PNG, WEBP · up to 15 MB</span
              ><input
                id="photo"
                type="file"
                accept="image/jpeg,image/png,image/webp"
            /></label>
            <div class="photo-actions">
              <button id="removePhoto" class="text-button" disabled>
                Remove photo</button
              ><span>Or paste an image</span>
            </div>
            <label for="name">Name</label
            ><input
              id="name"
              type="text"
              maxlength="40"
              placeholder="Your Name"
              autocomplete="off"
            />
            <label for="bio">Bio <span id="bioCount">0 / 140</span></label>
            <div class="bio-row">
              <textarea
                id="bio"
                maxlength="140"
                placeholder="Main character energy."
              ></textarea
              ><button
                id="rollBio"
                class="quiet"
                title="Roll a random bio"
                aria-label="Roll a random bio"
              >
                ⚄
              </button>
            </div>
            <div class="row">
              <div>
                <label for="handle">Handle</label
                ><input
                  id="handle"
                  type="text"
                  maxlength="32"
                  placeholder="@yourhandle"
                  autocomplete="off"
                />
              </div>
              <div>
                <label for="badge">Badge</label
                ><input
                  id="badge"
                  type="text"
                  maxlength="24"
                  placeholder="MAIN CHARACTER"
                  autocomplete="off"
                />
              </div>
            </div>
          </div>
        </details>
        <details open>
          <summary>
            <span class="section-number">02</span> Art direction
          </summary>
          <div class="section-body">
            <div class="label-row">
              <label>Choose a look</label
              ><button id="shuffle" class="text-button">✦ Surprise me</button>
            </div>
            <div
              id="presets"
              class="presets"
              role="group"
              aria-label="Visual presets"
            ></div>
            <div class="row">
              <div>
                <label for="style">Finish</label
                ><select id="style">
                  <option value="classic">Classic</option>
                  <option value="glow">Glow</option>
                  <option value="minimal">Minimal</option>
                  <option value="holo">Holographic</option>
                  <option value="synthwave">Synthwave</option>
                  <option value="noir">Film noir</option>
                </select>
              </div>
              <div>
                <label for="font">Typography</label
                ><select id="font">
                  <option value="bold">Bold</option>
                  <option value="clean">Clean</option>
                  <option value="wide">Wide</option>
                  <option value="mono">Monospace</option>
                  <option value="serif">Editorial</option>
                </select>
              </div>
            </div>
            <label>Accent color</label>
            <div
              class="colors"
              id="colors"
              role="group"
              aria-label="Accent color"
            ></div>
            <label class="check"
              ><input id="texture" type="checkbox" /> Fine grain texture</label
            >
          </div>
        </details>
        <details>
          <summary><span class="section-number">03</span> Photo lab</summary>
          <div class="section-body">
            <div class="row">
              <div>
                <label for="shape">Photo shape</label
                ><select id="shape">
                  <option value="circle">Circle</option>
                  <option value="rounded">Rounded square</option>
                  <option value="hexagon">Hexagon</option>
                </select>
              </div>
              <div>
                <label for="filter">Color grade</label
                ><select id="filter">
                  <option value="original">Original</option>
                  <option value="mono">Black & white</option>
                  <option value="warm">Golden hour</option>
                  <option value="cool">Arctic</option>
                  <option value="vivid">Vivid</option>
                </select>
              </div>
            </div>
            <label for="zoom">Zoom <output id="zoomText">100%</output></label
            ><input id="zoom" type="range" min="100" max="300" value="100" />
            <label for="posX"
              >Left / right <output id="posXText">Center</output></label
            ><input id="posX" type="range" min="-100" max="100" value="0" />
            <label for="pos"
              >Up / down <output id="posText">Center</output></label
            ><input id="pos" type="range" min="-100" max="100" value="0" />
            <label for="brightness"
              >Brightness <output id="brightnessText">100%</output></label
            ><input
              id="brightness"
              type="range"
              min="50"
              max="150"
              value="100"
            />
            <button id="centerPhoto" class="quiet full">
              Reset photo adjustments
            </button>
          </div>
        </details>
        <button id="reset" class="text-button reset">Start fresh</button>
      </aside>
      <section class="stage" aria-label="Live preview and export">
        <div class="stage-toolbar">
          <div
            class="segmented"
            id="formats"
            role="group"
            aria-label="Card format"
          >
            <button data-format="square" aria-pressed="true">Square</button
            ><button data-format="portrait" aria-pressed="false">
              Portrait</button
            ><button data-format="story" aria-pressed="false">Story</button
            ><button data-format="banner" aria-pressed="false">Banner</button>
          </div>
          <div class="history">
            <button
              id="undo"
              class="quiet"
              title="Undo (Ctrl/⌘ Z)"
              aria-label="Undo"
              disabled
            >
              ↶</button
            ><button
              id="redo"
              class="quiet"
              title="Redo (Ctrl/⌘ Shift Z)"
              aria-label="Redo"
              disabled
            >
              ↷
            </button>
          </div>
        </div>
        <div class="preview-space">
          <div id="previewWrap" class="preview-wrap">
            <canvas
              id="canvas"
              width="1080"
              height="1080"
              role="img"
              aria-label="Live profile card preview"
            ></canvas>
          </div>
        </div>
        <div class="preview-meta">
          <span id="dimensions">1080 × 1080</span
          ><span>Drag the photo to reframe</span
          ><label class="check tilt-toggle"
            ><input id="tilt" type="checkbox" /> 3D preview</label
          >
        </div>
        <div class="export-bar">
          <div>
            <label for="quality">PNG resolution</label
            ><select id="quality">
              <option value="1">Standard · 1×</option>
              <option value="2">Ultra · 2×</option>
            </select>
          </div>
          <button id="copyImage" class="quiet">Copy image</button
          ><button id="save" class="primary">
            Save / Share PNG <span aria-hidden="true">↗</span>
          </button>
        </div>
        <p class="privacy">
          Made here. Stays here. Photos and drafts stay in this browser.
        </p>
      </section>
    </main>
    <input
      id="projectFile"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  </body>
</html>
